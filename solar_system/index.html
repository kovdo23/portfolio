<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Solar System Model - Kovács Domonkos</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: #1e252d;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .header {
            width: 100%;
            max-width: 1000px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .header h1 {
            margin: 0;
            font-size: 1.5rem;
            letter-spacing: 1px;
        }
        .btn {
            color: #ffffff;
            background: transparent;
            text-decoration: none;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 8px 16px;
            border-radius: 4px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        .controls {
            font-size: 0.9rem;
            color: #a0aab5;
            margin-bottom: 15px;
            text-align: center;
        }
        canvas.emscripten {
            border: 2px solid #334155;
            border-radius: 6px;
            background-color: #000;
            display: block;
            max-width: 100%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        #output {
            width: 100%;
            max-width: 1000px;
            height: 100px;
            margin-top: 15px;
            background-color: #0f1419;
            color: #4ade80;
            font-family: monospace;
            font-size: 0.9rem;
            border: 1px solid #334155;
            border-radius: 6px;
            padding: 10px;
            box-sizing: border-box;
            resize: none;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>3D Solar System Model (C++ / WebGL)</h1>
        <a href="../index.html" class="btn">← Vissza a portfólióra</a>
    </div>

    <div class="controls">
        <strong>Kattintás a képre:</strong> egér zárolása (körbenézés) &nbsp;|&nbsp;
        <strong>WASD:</strong> repülés &nbsp;|&nbsp;
        <strong>Görgő:</strong> zoom &nbsp;|&nbsp;
        <strong>ESC:</strong> egér feloldása &nbsp;|&nbsp;
        <strong>Enter:</strong> újrakezdés
    </div>

    <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
    <textarea id="output" rows="4" readonly></textarea>

    <script>
        var Module = {
            canvas: document.getElementById('canvas'),
            print: function(text) {
                var output = document.getElementById('output');
                if (output) {
                    output.value += text + "\n";
                    output.scrollTop = output.scrollHeight;
                }
            },
            printErr: function(text) {
                console.error(text);
            }
        };
    </script>
    <script async src="index.js"></script>
</body>
</html>
